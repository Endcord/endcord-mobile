# Gradle
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true

# Kotlin
kotlin.code.style=official
kotlin.stdlib.default.dependency=false

# Android
android.useAndroidX=true

# Endcord
# GitHub repository ("owner/name") that hosts Endcord mobile. Builds are published to its `builds` branch,
# and the in-app updater, the injector and the installer all download from there.
endcord.repository=rootpoii/endcord-mobile
# Version of Endcord mobile shown to users and used by the updater. Bump it for every release.
# (The core module's own `version` is the Aliucord plugin API level it is compatible with.)
endcord.version=1.0.0
