name: Release Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.0.0)
        required: true
        type: string

jobs:
  release:
    name: Build and publish the installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Set version
        working-directory: installer
        run: sed -i -E "s/^version = .*/version = ${{ inputs.version }}/" gradle.properties
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.INSTALLER_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The INSTALLER_KEYSTORE secret is missing; see README.md"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > installer/app/keystore.jks
      - name: Build
        working-directory: installer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INSTALLER_KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.INSTALLER_KEY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.INSTALLER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/endcord-installer-v${{ inputs.version }}.apk"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: next-installer-v${{ inputs.version }}
          name: Endcord Installer (new Discord) ${{ inputs.version }}
          files: ${{ runner.temp }}/endcord-installer-v${{ inputs.version }}.apk
