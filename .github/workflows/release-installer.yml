name: Release Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 1.0.0)
        required: true
        type: string
  # Or by pushing a next-installer-v<version> tag, which the release is made for
  push:
    tags: ["next-installer-v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the installer
    runs-on: ubuntu-latest
    # The keystore is this environment's secret; see the Build workflow
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Set version
        working-directory: android/installer
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          version="${REQUESTED#next-installer-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.0.0, not $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sed -i -E "s/^version = .*/version = $version/" gradle.properties
      - name: Decode keystore
        env:
          KEYSTORE: ${{ secrets.INSTALLER_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::The INSTALLER_KEYSTORE secret is missing; see docs/DEVELOPMENT.md"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/installer/app/keystore.jks
      - name: Build
        working-directory: android/installer
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INSTALLER_KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.INSTALLER_KEY_ALIAS }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.INSTALLER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/endcord-installer-v$VERSION.apk"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: next-installer-v${{ env.VERSION }}
          name: Endcord Installer (new Discord) ${{ env.VERSION }}
          files: ${{ runner.temp }}/endcord-installer-v${{ env.VERSION }}.apk
