name: "Validate Gradle Wrapper"

on:
  workflow_dispatch:
  push:
    paths:
      - "**/gradlew*"
      - "**/gradle/wrapper/**"
  pull_request:
    paths:
      - "**/gradlew*"
      - "**/gradle/wrapper/**"

jobs:
  validation:
    name: "Validate Authenticity of Gradle Wrapper"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
