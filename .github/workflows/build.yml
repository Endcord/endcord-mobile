name: Build

on:
  push:
    branches: [next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: bundle
        run: bun install --frozen-lockfile
      - name: Check the translations
        working-directory: bundle
        # Without Endcord PC checked out, the shipped translations are checked: every string in all five languages
        run: node scripts/i18n-sync.mjs --strict
      - name: Build
        working-directory: bundle
        run: bun run build --release-branch ${{ github.ref_name }} --build-minify
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/dist/endcord.min.js

  loader:
    name: Loader (Xposed module)
    runs-on: ubuntu-latest
    env:
      LOADER_KEYSTORE: ${{ secrets.LOADER_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.LOADER_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.LOADER_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.LOADER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: loader
        run: |
          chmod +x gradlew
          if [ -n "$LOADER_KEYSTORE" ]; then
            echo "$LOADER_KEYSTORE" | base64 -d > "$RUNNER_TEMP/loader.jks"
            export KEYSTORE_FILE="$RUNNER_TEMP/loader.jks"
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk endcord-xposed.apk
          else
            echo "::warning::No LOADER_KEYSTORE secret: publishing the debug-signed module instead"
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk endcord-xposed.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: loader
          path: loader/endcord-xposed.apk

  installer:
    name: Installer
    runs-on: ubuntu-latest
    env:
      INSTALLER_KEYSTORE: ${{ secrets.INSTALLER_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.INSTALLER_KEYSTORE_PASSWORD }}
      KEYSTORE_ENTRY_ALIAS: ${{ secrets.INSTALLER_KEY_ALIAS }}
      KEYSTORE_ENTRY_PASSWORD: ${{ secrets.INSTALLER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: installer
        run: |
          chmod +x gradlew
          # Signed like the releases when the INSTALLER_KEYSTORE secrets exist, so either can update the other;
          # otherwise with the debug key
          if [ -n "$INSTALLER_KEYSTORE" ]; then
            echo "$INSTALLER_KEYSTORE" | base64 -d > app/keystore.jks
          else
            echo "::warning::No INSTALLER_KEYSTORE secret: publishing a debug-signed installer"
          fi
          ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/app/build/outputs/apk/release/*.apk

  classic-installer:
    # The installer offers Endcord Classic, on Aliucord's older Discord, through its own installer, which lives on the
    # main branch and is published next to this one
    name: Endcord Classic Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build
        working-directory: installer
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: classic-installer
          path: installer/app/build/outputs/apk/release/*.apk

  deploy:
    name: Publish to the builds-next branch
    needs: [bundle, loader, installer, classic-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Downloaded outside the checkout: builds-next tracks files with the same names, and untracked copies of them in
      # the working tree make git refuse to switch branches
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@v4
        with:
          name: loader
          path: ${{ runner.temp }}/out
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: ${{ runner.temp }}/installer
      - uses: actions/download-artifact@v4
        with:
          name: classic-installer
          path: ${{ runner.temp }}/classic-installer
      - name: Add the installers
        # Debug-signed until the INSTALLER_KEYSTORE secrets exist; releases come from the Release Installer workflow
        run: |
          cp "$RUNNER_TEMP"/installer/*.apk "$RUNNER_TEMP"/out/endcord-installer.apk
          cp "$RUNNER_TEMP"/classic-installer/*.apk "$RUNNER_TEMP"/out/endcord-classic-installer.apk
      - name: Write build info
        run: |
          cat > "$RUNNER_TEMP"/out/data.json <<EOF
          {
            "bundle": "endcord.min.js",
            "loader": "endcord-xposed.apk",
            "installer": "endcord-installer.apk",
            "classicInstaller": "endcord-classic-installer.apk",
            "loaderVersion": "$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' loader/app/build.gradle.kts)",
            "loaderVersionCode": $(sed -nE 's/^\s*versionCode = ([0-9]+)/\1/p' loader/app/build.gradle.kts),
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat "$RUNNER_TEMP"/out/data.json
      - name: Push
        # builds-next only serves the latest files, so every build replaces it with a single commit. Keeping old builds
        # in its history would grow the repository by the size of the APKs on every push.
        run: |
          git config http.postBuffer 524288000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds-next
          git rm -rf --quiet .
          cp "$RUNNER_TEMP"/out/* .
          git add -A
          git commit -m "Build ${{ github.sha }}"
          git push --force origin builds-next
