name: Build

on:
  push:
    branches: [next]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: bundle
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: bundle
        run: bun run build --release-branch ${{ github.ref_name }} --build-minify
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/dist/endcord.min.js

  loader:
    name: Loader (Xposed module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        if: ${{ secrets.LOADER_KEYSTORE != '' }}
        env:
          KEYSTORE: ${{ secrets.LOADER_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/loader.jks"
      - name: Build
        working-directory: loader
        env:
          KEYSTORE_FILE: ${{ secrets.LOADER_KEYSTORE != '' && format('{0}/loader.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.LOADER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOADER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOADER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk endcord-xposed.apk
          else
            echo "::warning::No LOADER_KEYSTORE secret: publishing the debug-signed module instead"
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk endcord-xposed.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: loader
          path: loader/endcord-xposed.apk

  installer:
    name: Installer (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: installer
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: installer-debug
          path: installer/app/build/outputs/apk/debug/*.apk

  deploy:
    name: Publish to the builds-next branch
    needs: [bundle, loader]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: loader
          path: out
      - name: Write build info
        run: |
          cat > out/data.json <<EOF
          {
            "bundle": "endcord.min.js",
            "loader": "endcord-xposed.apk",
            "loaderVersion": "$(sed -nE 's/^\s*versionName = "(.*)"/\1/p' loader/app/build.gradle.kts)",
            "loaderVersionCode": $(sed -nE 's/^\s*versionCode = ([0-9]+)/\1/p' loader/app/build.gradle.kts),
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat out/data.json
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin builds-next || true
          git checkout -B builds-next origin/builds-next 2>/dev/null || git checkout --orphan builds-next
          git rm -rf --quiet . 2>/dev/null || true
          cp out/* .
          git add -A
          git commit -m "Build ${{ github.sha }}" || echo "Nothing changed"
          git push origin builds-next
