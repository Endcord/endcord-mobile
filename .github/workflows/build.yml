name: Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - "installer/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "installer/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout src
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-24'

      - name: Check translations
        run: node scripts/i18n-sync.js || echo "::warning::Some strings are missing translations, see the log above"

      - name: Build
        env:
          RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace \
            :Aliucord:make :Injector:make :kotlin-stdlib:make \
            :patches:package :patches:disassembleWithPatches :patches:testPatches

      # Catches calls that compile but don't exist on Android 7 or in the Kotlin stdlib the app runs with.
      # Calls to newer Android APIs are expected when guarded by Build.VERSION.SDK_INT checks.
      - name: Check runtime references
        run: |
          discord="$(find ~/.gradle/caches -path '*transformed/jars/discord-*.jar' | head -1)"
          stdlib="$(find ~/.gradle/caches/modules-2 -name 'kotlin-stdlib-1.5.21.jar' | head -1)"
          aliuhook="$(find ~/.gradle/caches/modules-2 -path '*Aliuhook*' -name '*.aar' | head -1)"
          injector="$(find Injector/build/intermediates -name classes.jar | head -1)"
          python3 scripts/check-runtime-refs.py Aliucord/build/outputs/Aliucord.zip             "$ANDROID_SDK_ROOT/platforms/android-24/android.jar" "$injector" "$discord" "$stdlib" "$aliuhook"             | tee runtime-refs.txt
          if grep -v '\[platform\]' runtime-refs.txt | grep -q '^  L'; then
            echo "::warning::The core references classes or methods that don't exist at runtime, see runtime-refs.txt"
          fi

      - name: Collect build outputs
        run: |
          mkdir -p out
          cp Aliucord/build/outputs/Aliucord.zip out/Endcord.zip
          cp Injector/build/outputs/Injector.dex out/
          cp patches/build/outputs/patches.zip out/
          cp kotlin-stdlib/build/outputs/kotlin.dex out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          if-no-files-found: error
          path: out/*

  # Publishes the build to the `builds` branch when any component version changed. The in-app updater, the injector
  # and Endcord Installer all download from there. Bump `endcord.version` in gradle.properties to ship an update.
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ build ]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    steps:
      - name: Checkout src
        uses: actions/checkout@v6
        with:
          path: src
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: artifacts

      - name: Checkout builds branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" builds > /dev/null; then
            git clone --depth 1 --branch builds "$url" builds
          else
            # First deploy: start an empty orphan branch
            mkdir builds && cd builds
            git init -q -b builds
            git remote add origin "$url"
          fi

      - name: Deploy if versions changed
        run: |
          cd "$GITHUB_WORKSPACE"
          coreVersion="$(grep -E '^endcord.version=' src/gradle.properties | cut -d= -f2)"
          injectorVersion="$(grep -E '^version = "' src/Injector/build.gradle.kts | cut -d '"' -f 2)"
          patchesVersion="$(grep -E '^version = "' src/patches/build.gradle.kts | cut -d '"' -f 2)"
          kotlinVersion="$(grep -E '^kotlin-stdlib = "' src/gradle/libs.versions.toml | cut -d '"' -f 2)"

          old="builds/data.json"
          changed=false
          for pair in "coreVersion=$coreVersion" "injectorVersion=$injectorVersion" "patchesVersion=$patchesVersion" "kotlinVersion=$kotlinVersion"; do
            key="${pair%%=*}"; value="${pair#*=}"
            if [ ! -f "$old" ] || [ "$(jq -r ".$key" "$old")" != "$value" ]; then changed=true; fi
          done
          if [ "$changed" != "true" ]; then
            echo "No component version changed, nothing to deploy"
            exit 0
          fi

          cp artifacts/Endcord.zip artifacts/Injector.dex artifacts/patches.zip artifacts/kotlin.dex builds/

          changelog=""
          if [ -f src/.assets/changelog.md ]; then changelog="$(cat src/.assets/changelog.md)"; fi
          jq '. + { coreVersion: $cv, injectorVersion: $iv, patchesVersion: $pv, kotlinVersion: $kv, changelog: $cl }' \
            --arg cv "$coreVersion" \
            --arg iv "$injectorVersion" \
            --arg pv "$patchesVersion" \
            --arg kv "$kotlinVersion" \
            --arg cl "$changelog" \
            src/.assets/data.json > builds/data.json

          cd builds
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA} (Endcord ${coreVersion})"
          git push origin builds
