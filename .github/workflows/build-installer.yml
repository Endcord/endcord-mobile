name: Build Installer

on:
  push:
    paths:
      - "installer/**"
      - ".github/workflows/build-installer.yml"
  pull_request:
    paths:
      - "installer/**"
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: Version of this release, for example 1.0.1 (must be higher than the last release)
      title:
        required: false
        description: Title of the release
      notes:
        required: false
        description: Release notes (markdown)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: installer
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleDebug

      - name: Upload debug APK
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: endcord-installer-debug
          path: installer/app/build/outputs/apk/debug/*.apk

      # Releases are signed with the keystore stored in the repository secrets:
      # SIGNING_STORE_BASE64 (base64 of the .jks), SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RELEASE: true
          INSTALLER_VERSION: ${{ github.event.inputs.version }}
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_BASE64" ]; then
            echo "::error::The SIGNING_STORE_BASE64 secret is missing, see the README for how to create a signing key"
            exit 1
          fi
          echo "$SIGNING_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          chmod +x gradlew
          ./gradlew --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/endcord-installer-v${INSTALLER_VERSION}.apk"
          rm "$RUNNER_TEMP/release.jks"

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
          TITLE: ${{ github.event.inputs.title }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          tag="v${VERSION}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "${TITLE:-Endcord Installer $tag}" \
            --notes "${NOTES:-Endcord Installer $tag}" \
            "$RUNNER_TEMP/endcord-installer-${tag}.apk"
